:root {
  --bg: #000000;
  --surface: #020a03;
  --panel: #03130a;
  --panel-2: #041a0d;
  --line: #0f3d1e;
  --line-bright: #1d7a3a;
  --primary: #00ff00;
  --primary-dim: #00b32d;
  --primary-faint: #063d14;
  --amber: #ffb000;
  --text: #d9ffd9;
  --muted: #6fbf7f;
  --faint: #3d7a4c;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #020a03;
    --panel: #03130a;
    --panel-2: #041a0d;
    --line: #0f3d1e;
    --line-bright: #1d7a3a;
    --primary: #00ff00;
    --primary-dim: #00b32d;
    --primary-faint: #063d14;
    --amber: #ffb000;
    --text: #d9ffd9;
    --muted: #6fbf7f;
    --faint: #3d7a4c;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: var(--primary);
  color: #000;
}
::selection {
  background: var(--primary);
  color: #000;
}
/* ---------- Scanner-Animationen ---------- */
@keyframes beam-idle {
  0% {
    top: -6%;
  }
  100% {
    top: 106%;
  }
}
@keyframes blink-hard {
  0%,
  55% {
    opacity: 1;
  }
  56%,
  100% {
    opacity: 0.1;
  }
}
@keyframes ori-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(255, 176, 0, 0.75);
  }
  100% {
    box-shadow: 0 0 0 12px rgba(255, 176, 0, 0);
  }
}
@keyframes dot-pop {
  0% {
    transform: scale(1.9);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes crt-flicker {
  0%,
  100% {
    opacity: 1;
  }
  92% {
    opacity: 1;
  }
  93% {
    opacity: 0.86;
  }
  94% {
    opacity: 1;
  }
  97% {
    opacity: 0.94;
  }
}
.anim-blink {
  animation: blink-hard 1.1s steps(1) infinite;
}
.anim-flicker {
  animation: crt-flicker 7s linear infinite;
}
.anim-ori {
  animation: ori-pulse 1.6s ease-out infinite;
}
.anim-pop {
  animation: dot-pop 0.35s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .anim-blink,
  .anim-flicker,
  .anim-ori,
  .anim-pop {
    animation: none;
  }
}
/* ---------- Fokus-Slider ---------- */
input[type="range"].fokus-range {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
  background: transparent;
  cursor: pointer;
  width: 100%;
}
input[type="range"].fokus-range::-webkit-slider-runnable-track {
  height: 4px;
  background: linear-gradient(
    90deg,
    var(--primary) 0%,
    var(--primary-dim) 55%,
    var(--primary-faint) 100%
  );
  border: 1px solid var(--line);
}
input[type="range"].fokus-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -9px;
  background: #000;
  border: 2px solid var(--primary);
  box-shadow: 0 0 14px rgba(0, 255, 0, 0.85);
}
input[type="range"].fokus-range::-moz-range-track {
  height: 4px;
  background: linear-gradient(
    90deg,
    var(--primary) 0%,
    var(--primary-dim) 55%,
    var(--primary-faint) 100%
  );
  border: 1px solid var(--line);
}
input[type="range"].fokus-range::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 0;
  background: #000;
  border: 2px solid var(--primary);
  box-shadow: 0 0 14px rgba(0, 255, 0, 0.85);
}
input[type="range"].fokus-range:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 6px;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
